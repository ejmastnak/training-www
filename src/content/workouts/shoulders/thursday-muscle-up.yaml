name: "Thursday's Muscle-Up Conditioning"
type: workout
phases:

  - name: "Warm-Up"
    payload:
      - name: "Ball Walks"
        sets: 2
        reps: 20
        suffix: "yards"
      - name: "Foam Roller Walks"
        sets: 2
        reps: 20
        suffix: "yards"
      - name: "Shoulder Rotator Warm-Up"
        combo: true
        sets: 1
        reps: 1
        suffix: "set"
      - name: "Standing Rhomboid Pull-Ups"
        sets: 1
        reps: 12
        suffix: "reps"

  - name: "Rings"
    payload:
      - name: "Ring Swings to Long Jump"
        sets: 3
        reps: 8-6-8
        suffix: "reps"
      - name: "Ring Pull-Ups"
        sets: 3
        reps: 5
        suffix: "reps"

  - name: "Muscle-Up Progression"
    payload:
      - name: "Straight-Bar Dip to L-Sit"
        sets: 2
        reps: 5
        suffix: "reps"
      - name: "Assisted Muscle Up"
        sets: 2
        reps: 5
        suffix: "reps"
      - name: "Straight-Bar Dip to L-Sit"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Gymnastics Rings Combo"
        sets: 1
        reps: 1
        suffix: "set"

  - name: "Thursday's Legs"
    payload:
      - name: "Barbell Side Lunges"
        sets: 2
        reps: 20
        suffix: "yards es"
      - name: "Barbell Forward Lunge to RDL Walking"
        sets: 2
        reps: 20
        suffix: "yards"
      - name: "Barbell Single-Leg Squat"
        sets: 1
        reps: 5
        suffix: "reps es"

  - name: "Olympic Lifting Combo"
    payload:
      - name: "Deadlift"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Barbell Power Pulls"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Hang Clean"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Hang Snatch"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Overhead Squat"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Snatch"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Multidirectional Lunge Combo"
        combo: true
        sets: 1
        reps: 2
        suffix: "set"
      - name: "Split and Jerk"
        sets: 1
        reps: 6
        suffix: "reps total"
      - name: "Stiff-Legged Deadlift"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Bent-Over Row"
        sets: 1
        reps: 5
        suffix: "rep"

  - name: "Stabilization"
    payload:
      - name: "Shrugs"
        sets: 1
        reps: 12
        suffix: "reps"
      - name: "Double EB Stability Bridge"
        sets: 1
        reps: 22
        suffix: "seconds"
      - name: "Ball Walks"
        sets: 1
        reps: 20
        suffix: "yards"
      - name: "Double EB Bridge"
        sets: 1
        reps: 22
        suffix: "seconds"
