name: "Handstand Conditioning"
type: workout
phases:

  - name: "Warm-Up"
    payload:
      - name: "Ball Walks"
        sets: 2
        reps: 20
        suffix: "yards"
      - name: "Foam Roller Walks"
        sets: 2
        reps: 20
        suffix: "yards"
      - name: "Shoulder Rotator Warm-Up"
        combo: true
        sets: 1
        reps: 1
        suffix: "set"
      - name: "Standing Rhomboid Pull-Ups"
        sets: 1
        reps: 12
        suffix: "reps"

  - name: "Pull-Ups"
    payload:
      - name: "Pull-Up to Static Hold"
        sets: 3
        reps: 8
        suffix: "seconds"
      - name: "Pull-Up to Static L-Sit"
        sets: 3
        reps: 8
        suffix: "seconds"

  - name: "Handstand"
    payload:
      - name: "Reverse V-Up Handstand Progression"
        sets: 2
        reps: 6
        suffix: "reps hlr"
      - name: "Split-Leg Handstand Kick-Ups Against Wall"
        sets: 1
        reps: 6
        suffix: "reps"
      - name: "Parallel-Leg Handstand Kick-Ups Against Wall"
        sets: 1
        reps: 5
        suffix: "reps"
      - name: "Reverse V-Up Handstand Progression"
        sets: 2
        reps: 6
        suffix: "reps hlr"
      - name: "SL Reverse V-Up Handstand Progression"
        sets: 1
        reps: 4
        suffix: "reps es hlr"
      - name: "Standing Handstand Kick Up with PP"
        sets: 1
        reps: 4
        suffix: "reps es hlr"
      - name: "Reverse Extension to Wall Handstand"
        sets: 1
        reps: 8
        suffix: "reps hlr"
      - name: "Static Elbow Bridge on EB"
        sets: 1
        reps: 30
        suffix: "seconds"

  - name: "Stabilization"
    payload:
      - name: "Elbow Bridge on EB with Hip Side-to-Side"
        sets: 1
        reps: 22
        suffix: "seconds"
      - name: "Elbow Bridge on EB with Hip Rotations"
        sets: 1
        reps: 22
        suffix: "seconds"
      - name: "SL Elbow Bridge on EB"
        sets: 2
        reps: 8
        suffix: "seconds es"
      - name: "Supine Static SL Extensions on EB"
        sets: 2
        reps: 8
        suffix: "seconds es"
      - name: "Exercise Ball Kneeling"
        sets: 1
        reps: 30
        suffix: "seconds es"
      - name: "Ball Walks"
        sets: 1
        reps: 20
        suffix: "yards"
      - name: "Double EB Bridge"
        sets: 1
        reps: 22
        suffix: "seconds"
